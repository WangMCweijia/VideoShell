apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// 签名配置：**优先环境变量**（CI 从 GitHub Secrets 注入），其次本地 `keystore.properties`。
//
// ⚠️ 为什么不把 keystore.properties / *.jks 放进仓库（v1.0.54 改）：
// 仓库转 public 后，签名私钥就是**公开**的 —— 任何人都能签一个 versionCode 更大的
// 同名包，而 Android 只认签名：装了它，就等于把"更新"交到别人手里。
// 所以密钥走 GitHub Secrets，本地留一份（已在 .gitignore 里），两边都能出**真签名**包。
//
// 为什么 debug 也用 release 钥匙：默认 debug 走 Android 调试密钥，于是 debug 包与
// release 包**互相覆盖安装会失败**（「应用未安装：签名冲突」），用户以为装了新版、
// 其实还停在旧版 —— 现象是「我明明装了，怎么还是老样子」，任何代码排查都解释不通。
def keystoreProps = new Properties()
def localPropsFile = rootProject.file("keystore.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { keystoreProps.load(it) }
}

def envStoreFile = System.getenv("VS_KEYSTORE_FILE")
def envStorePwd  = System.getenv("VS_STORE_PASSWORD")
def envAlias     = System.getenv("VS_KEY_ALIAS")
def envKeyPwd    = System.getenv("VS_KEY_PASSWORD")
def hasEnvKeys   = envStoreFile && envStorePwd && envAlias && envKeyPwd
def hasSigning   = hasEnvKeys || localPropsFile.exists()

android {
    namespace 'com.videoshell'
    compileSdk 34

    defaultConfig {
        applicationId "com.videoshell"
        minSdk 21
        targetSdk 34
        versionCode 66
        versionName "1.0.66"
        vectorDrawables.useSupportLibrary = true
        resConfigs "zh", "en"
    }

    signingConfigs {
        release {
            if (hasEnvKeys) {
                storeFile file(envStoreFile)
                storePassword envStorePwd
                keyAlias envAlias
                keyPassword envKeyPwd
            } else if (localPropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES',
                         'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module',
                         'DebugProbesKt.bin']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.11.0'   // DoH 兜底 DNS（图床域名被污染时自救）
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jsoup:jsoup:1.17.1'
    implementation 'io.coil-kt:coil:2.5.0'

    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'

    // 后台播放的媒体通知 + 锁屏控制（FN-4）
    implementation 'androidx.media:media:1.7.0'
}
