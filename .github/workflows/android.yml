name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 离线回归（37 个套件 / 1687 条源码·行为守卫，约 2 分钟）。
      # 它读的是**源码文本 + 上面刚编译出的 kotlin-classes/R.jar**，所以必须排在 Build 之后；
      # 联网套件（NET_SUITES，11 个）默认不跑 —— 它们**对真实域名发起读请求**，
      # 而 runner 的出口位置与开发机不同（中文站、带签名的短效 CDN 直链在 runner 上
      # 连不上）。判据是"有没有发读请求"，不是"源码里有没有域名"（见 PITFALLS 4.36）。
      # 跑失败 = 有既有规则被破坏（v1.0.53 那次「Absent ⇒ 零成本」被静默删掉就只被它抓到），
      # 所以这一步是**硬门禁**，不要改成 continue-on-error。
      # 「零断言」也算失败（runall.py 里的 WEAK）：否则夹具缺失会伪装成全绿。
      - name: Offline regression (source guards)
        run: python tools/verify/runall.py

      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs
          path: |
            tools/verify/_fail_*.txt
            tools/verify/_*.out.txt
          if-no-files-found: ignore

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videoshell-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
